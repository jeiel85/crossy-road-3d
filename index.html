        const lastNick = localStorage.getItem('crossy_player_name') || '길건너용사';
        document.getElementById('player-nickname').value = lastNick;
        sfx.playFanfare();
      } else {
        newRankSection.style.display = 'none';
      }

      document.getElementById('game-over-modal').style.display = 'flex';
    }

    function restartGame() {
      document.getElementById('game-over-modal').style.display = 'none';
      if (eagle) {
        scene.remove(eagle);
        disposeHierarchy(eagle);
        eagle = null;
      }
      eagleActive = false;
      isGameOver = false;

      player.reset();
      laneManager.init();
      particleSys.clear();

      score = 0;
      maxLaneReached = 0;
      cameraZ = 0;
      cameraMinZ = -CELL_SIZE * 2;
      currentBiome = BIOME_TYPES.grassland;
      updateBiome(0);

      document.getElementById('score-display').innerText = '0';
    }

    document.getElementById('restart-btn').addEventListener('click', restartGame);

    // 랭킹 모달 이벤트
    const rankingModal = document.getElementById('ranking-modal');
    function openRankingModal(highlightRank = -1) {
      leaderboard.render(highlightRank);
      rankingModal.style.display = 'flex';
    }
    function closeRankingModal() {
      rankingModal.style.display = 'none';
      clock.getDelta();
    }


    // 자동 플레이 토글 버튼 & 단축키 [P]
    const autoPlayBtn = document.getElementById('auto-play-btn');
    if (autoPlayBtn) {
      autoPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        autoPlayAgent.toggle();
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyP') {
        autoPlayAgent.toggle();
      }
    });

    
    // 모바일 뷰 시뮬레이터 토글
    function resizeRenderer() {
      const shell = document.getElementById('game-shell') || document.getElementById('game-container');
      const w = shell.clientWidth;
      const h = shell.clientHeight;
      const aspect = w / h;
      camera.left = -d * aspect;
      camera.right = d * aspect;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    const mobileViewBtn = document.getElementById('mobile-view-btn');
    if (mobileViewBtn) {
      mobileViewBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMobileView();
      });
    }

    // ==========================================================================
    // 모바일 뷰 & 슬림 메뉴 상호작용 로직
    // ==========================================================================
    function toggleMobileView() {
      document.body.classList.toggle('mobile-sim-active');
      const isMobile = document.body.classList.contains('mobile-sim-active');
      const mbBtn = document.getElementById('mobile-view-btn');
      if (mbBtn) {
        mbBtn.innerText = isMobile ? '🖥️ PC 전체화면' : '📱 모바일 뷰';
        mbBtn.style.color = isMobile ? '#2563eb' : '#0f172a';
      }
      const mdm = document.getElementById('mobile-dropdown-menu');
      if (mdm) mdm.classList.remove('open');
      resizeRenderer();
      setTimeout(resizeRenderer, 360);
    }

    function syncMobileMenuUI() {
      const apText = document.getElementById('mobile-autoplay-text');
      const apItem = document.getElementById('mobile-item-autoplay');
      if (apText && window.autoPlayAgent) {
        apText.innerText = autoPlayAgent.enabled ? '자동 플레이: ON' : '자동 플레이: OFF';
        if (apItem) {
          apItem.style.background = autoPlayAgent.enabled ? 'rgba(34, 197, 94, 0.25)' : 'rgba(255, 255, 255, 0.08)';
          apItem.style.color = autoPlayAgent.enabled ? '#4ade80' : '#f8fafc';
        }
      }
      const soundText = document.getElementById('mobile-sound-text');
      const soundIcon = document.getElementById('mobile-sound-icon');
      if (soundText && soundIcon && window.sfx) {
        soundText.innerText = sfx.isMuted ? '소리: 꺼짐' : '소리: 켜짐';
        soundIcon.innerText = sfx.isMuted ? '🔇' : '🔊';
      }
      const charIcon = document.getElementById('mobile-char-icon');
      const curIcon = document.getElementById('current-char-icon');
      if (charIcon && curIcon) {
        charIcon.innerText = curIcon.innerText;
      }
    }

    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileDropdown = document.getElementById('mobile-dropdown-menu');
    const mobileMenuClose = document.getElementById('mobile-menu-close');

    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!mobileDropdown) return;
        syncMobileMenuUI();
        mobileDropdown.classList.toggle('open');
      });
    }

    if (mobileMenuClose) {
      mobileMenuClose.addEventListener('click', (e) => {
        e.stopPropagation();
        if (mobileDropdown) mobileDropdown.classList.remove('open');
      });
    }

    document.addEventListener('click', (e) => {
      if (mobileDropdown && mobileDropdown.classList.contains('open')) {
        if (!e.target.closest('.mobile-action-container')) {
          mobileDropdown.classList.remove('open');
        }
      }
    });

    const mItemAutoplay = document.getElementById('mobile-item-autoplay');
    if (mItemAutoplay) {
      mItemAutoplay.addEventListener('click', (e) => {
        e.stopPropagation();
        autoPlayAgent.toggle();
        syncMobileMenuUI();
      });
    }

    const mItemRanking = document.getElementById('mobile-item-ranking');
    if (mItemRanking) {
      mItemRanking.addEventListener('click', (e) => {
        e.stopPropagation();
        if (mobileDropdown) mobileDropdown.classList.remove('open');
        openRankingModal();
      });
    }

    const mItemChar = document.getElementById('mobile-item-char');
    if (mItemChar) {
      mItemChar.addEventListener('click', (e) => {
        e.stopPropagation();
        if (mobileDropdown) mobileDropdown.classList.remove('open');
        sfx.init();
        renderCharGrid();
        const cm = document.getElementById('char-modal');
        if (cm) cm.style.display = 'flex';
      });
    }

    const mItemSound = document.getElementById('mobile-item-sound');
    if (mItemSound) {
      mItemSound.addEventListener('click', (e) => {
        e.stopPropagation();
        sfx.init();
        const muted = sfx.toggleMute();
        const mainMuteBtn = document.getElementById('mute-btn');
        if (mainMuteBtn) mainMuteBtn.innerText = muted ? '🔇' : '🔊';
        syncMobileMenuUI();
      });
    }

    const mItemFullscreen = document.getElementById('mobile-item-fullscreen');
    if (mItemFullscreen) {
      mItemFullscreen.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMobileView();
      });
    }

    const desktopSimExitBtn = document.getElementById('desktop-sim-exit-btn');
    if (desktopSimExitBtn) {
      desktopSimExitBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMobileView();
      });
    }


    // 랭킹 모달 탭 전환 이벤트
    const tabGlobalBtn = document.getElementById('tab-global');
    const tabLocalBtn = document.getElementById('tab-local');
    if (tabGlobalBtn) {
      tabGlobalBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        leaderboard.setTab('global');
      });
    }
    if (tabLocalBtn) {
      tabLocalBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        leaderboard.setTab('local');
      });
    }

        document.getElementById('ranking-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openRankingModal();
    });
    document.getElementById('restart-rank-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openRankingModal();
    });
    document.getElementById('ranking-close-btn').addEventListener('click', closeRankingModal);
    document.getElementById('ranking-reset-btn').addEventListener('click', () => {
      if (confirm('명예의 전당 랭킹 기록을 초기화하시겠습니까?')) {
        leaderboard.reset();
      }
    });

    // 닉네임 랭킹 등록
    const submitRankBtn = document.getElementById('submit-rank-btn');
    if (submitRankBtn) {
      submitRankBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (rankSubmitted || currentAchievedRank <= 0) return;
        const nickInput = document.getElementById('player-nickname');
        const nick = (nickInput.value.trim() || '길건너용사').slice(0, 8);
        localStorage.setItem('crossy_player_name', nick);

        const curChar = CHARACTERS.find(c => c.id === selectedCharId) || CHARACTERS[0];
        const newRank = leaderboard.addScore(
          nick,
          score,
          coins,
          curChar.id,
          curChar.icon,
          currentBiome.name
        );
        rankSubmitted = true;
        document.getElementById('new-rank-section').style.display = 'none';
        openRankingModal(newRank);
      });
    }


    const muteBtn = document.getElementById('mute-btn');
    if (muteBtn) {
      muteBtn.addEventListener('click', e => {
        e.stopPropagation();
        sfx.init();
        const muted = sfx.toggleMute();
        muteBtn.innerText = muted ? '🔇' : '🔊';
        if (typeof syncMobileMenuUI === 'function') syncMobileMenuUI();
      });
    }

    /* ==========================================================================
       13. 메인 렌더 루프
       ========================================================================== */
    const autoPlayAgent = new AutoPlayAgent();
    window.autoPlayAgent = autoPlayAgent;
    window.gameState = {
      get score() { return score; },
      get coins() { return coins; },
      get biome() { return currentBiome.name; },
      get isGameOver() { return isGameOver; },
      get playerZ() { return player.mesh.position.z; },
      get currentLane() { return player.laneIndex; }
    };

    const clock = new THREE.Clock();
    const cameraTarget = new THREE.Vector3();

    function isAnyModalActive() {
      const cm = document.getElementById('char-modal');
      const rm = document.getElementById('ranking-modal');
      const gom = document.getElementById('game-over-modal');
      const mdm = document.getElementById('mobile-dropdown-menu');
      const isChar = cm && cm.style.display === 'flex';
      const isRank = rm && rm.style.display === 'flex';
      const isGameOver = gom && gom.style.display === 'flex';
      const isMenuOpen = mdm && mdm.classList.contains('open');
      return isChar || isRank || isGameOver || isMenuOpen;
    }

    function animate() {
      requestAnimationFrame(animate);
      const rawDelta = clock.getDelta();

      // 모달 창이 열려 있을 때 게임 물리 및 이동 완전 동결 (Pause)
      if (isAnyModalActive()) {
        renderer.render(scene, camera);
        return;
      }

      const delta = Math.min(rawDelta, 0.1);

      autoPlayAgent.update(delta);
      particleSys.update(delta);
      player.update(delta);
      laneManager.update(delta, player.mesh.position.z);
      checkCollisions();

      if (player.laneIndex > maxLaneReached) {
        maxLaneReached = player.laneIndex;
        score = maxLaneReached;
        document.getElementById('score-display').innerText = score;
        updateBiome(player.laneIndex);
        if (score > 0) {
          const hint = document.querySelector('.bottom-hint');
          if (hint && hint.style.opacity !== '0') {
            hint.style.opacity = '0';
            hint.style.transition = 'opacity 0.6s ease';
            hint.style.pointerEvents = 'none';
          }
        }
      }

      if (!isGameOver) {
        cameraMinZ += BASE_CAMERA_SPEED * delta;
        const targetZ = Math.max(cameraMinZ, player.mesh.position.z + 10);
        cameraZ += (targetZ - cameraZ) * 0.08;
      }

      if (eagleActive && eagle) {
        eagle.position.z += 620 * delta;
        eagle.position.y = Math.max(12, eagle.position.y - 160 * delta);

        if (eagle.leftWing && eagle.rightWing) {
          const flap = Math.sin(Date.now() * 0.03) * 0.4;
          eagle.leftWing.rotation.z = flap;
          eagle.rightWing.rotation.z = -flap;
        }

        if (Math.abs(eagle.position.z - player.mesh.position.z) < 22) {
          triggerGameOver('독수리에게 낚아채였습니다!');
          player.mesh.position.copy(eagle.position);
          player.mesh.position.y -= 7;
          particleSys.create(player.mesh.position.x, player.mesh.position.y, player.mesh.position.z, 0xFFFFFF, 8, 30);
        }

        if (eagle.position.z > player.mesh.position.z + 350) {
          scene.remove(eagle);
          disposeHierarchy(eagle);
          eagle = null;
        }
      }

      const desiredLookAt = new THREE.Vector3(
        player.mesh.position.x * 0.45,
        0,
        cameraZ + 40
      );
      cameraTarget.lerp(desiredLookAt, 0.1);

      camera.position.set(
        cameraTarget.x + CAMERA_OFFSET.x,
        cameraTarget.y + CAMERA_OFFSET.y,
        cameraTarget.z + CAMERA_OFFSET.z
      );
      camera.lookAt(cameraTarget);

      sunLight.position.set(
        cameraTarget.x - 180,
        cameraTarget.y + 420,
        cameraTarget.z - 100
      );
      sunLight.target.position.copy(cameraTarget);
      sunLight.target.updateMatrixWorld();

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', resizeRenderer);
  </script>
  </div>
</body>
</html>
